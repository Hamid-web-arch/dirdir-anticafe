name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # GitHub Pages-də sayt /dirdir-anticafe/ altındadır (Vercel-də isə kökdə).
      # Backend ünvanı .env.production faylından gəlir.
      - run: npm run build
        env:
          VITE_BASE: /dirdir-anticafe/
      - run: cp dist/index.html dist/404.html

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
